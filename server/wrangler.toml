# Színkorong szinkron-szerver (Cloudflare Workers + D1). Telepítés: docs/PROFIL.md.
# Titok (PEPPER) NINCS ebben a fájlban: `npx wrangler secret put PEPPER` teszi be a Cloudflare-be.
name = "szinkorong-sync"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

# Naplózás és megfigyelés kikapcsolva: a szerver semmit nem jegyez fel a kérésekről.
[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://bajzatzsolti-cmd.github.io"

# Az adatbázis EU-s tárolással (jurisdiction = eu), létrehozás: npx wrangler d1 create szinkorong --jurisdiction eu
[[d1_databases]]
binding = "DB"
database_name = "szinkorong"
database_id = "ee777d60-a4d7-47ba-bdce-6f1b5e6fc812"

# Kérésszám-korlát: azonosítónként/IP-nként percenként 30 kérés (a Cloudflare oldalán, átmenetileg számolva).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
